name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-event-creation:
    name: Test Event Creation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update submodules
        run: |
          git submodule update --init --recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check backend directory
        run: |
          ls -la
          ls -la backend || echo "Backend directory not found"
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing requests only"
            pip install requests
          fi
      
      - name: Run Event Creation Tests (Deployed)
        run: |
          cd backend
          python3 test_event_creation.py --deployed
      
      - name: Test Results Summary
        if: always()
        run: |
          echo "Event Creation Tests Complete"
  
  test-follow-system:
    name: Test Follow System
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update submodules
        run: |
          git submodule update --init --recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing requests only"
            pip install requests
          fi
      
      - name: Run Follow System Tests
        run: |
          cd backend
          python3 test_follow_system.py
      
      - name: Test Results Summary
        if: always()
        run: |
          echo "Follow System Tests Complete"
